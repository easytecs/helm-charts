apiVersion: v1
kind: Service
metadata:
  name: kmind-client-svc
  labels:
    {{- include "kmind-client.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kmind-client.selectorLabels" . | nindent 4 }}
